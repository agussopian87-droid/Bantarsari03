<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Pilkades Bantarsari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f5;
      color: #18382d;
    }

    /* Peringatan jika HP portrait */
    #landscapeWarning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #075c3b;
      color: white;
      text-align: center;
      padding: 30px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #landscapeWarning h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #landscapeWarning p {
      font-size: 18px;
    }

    @media (orientation: portrait) {
      #landscapeWarning {
        display: flex;
      }

      .app {
        display: none;
      }
    }

    .header {
      background: #087443;
      color: white;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: white;
      color: #087443;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 15px;
    }

    .dashboard {
      background: white;
      color: #087443;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 35px 25px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h2 {
      font-size: 34px;
      margin: 0;
    }

    .title p {
      color: #718078;
      font-size: 19px;
      margin-top: 8px;
    }

    .instruction {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .instruction h3 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .instruction p {
      margin: 0;
      color: #68756f;
      font-size: 17px;
    }

    .candidate-area {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .candidate-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .candidate {
      border: 3px solid #d9e5df;
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: .2s;
      max-width: 380px;
      margin: auto;
      text-align: center;
    }

    .candidate:hover {
      border-color: #087443;
      transform: translateY(-2px);
    }

    .candidate img {
      width: 220px;
      height: 270px;
      object-fit: cover;
      border-radius: 15px;
      border: 4px solid #087443;
    }

    .number {
      margin-top: 15px;
      font-size: 42px;
      font-weight: bold;
      color: #087443;
    }

    .candidate h3 {
      margin: 8px 0 3px;
      font-size: 23px;
    }

    .candidate p {
      margin: 0;
      color: #68756f;
    }
