<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilkades Bantarsari</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f1;
    color: #222;
}

.header {
    background: #116530;
    color: white;
    text-align: center;
    padding: 15px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 5px 0 0;
}

.container {
    padding: 20px;
    max-width: 1100px;
    margin: auto;
}

.judul {
    text-align: center;
    margin-bottom: 20px;
}

.judul h2 {
    margin: 0;
    font-size: 27px;
}

.calon-container {
    display: flex;
    justify-content: center;
    gap: 25px;
}

.calon {
    width: 30%;
    min-width: 220px;
    background: white;
    border-radius: 18px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
    cursor: pointer;
    transition: .2s;
}

.calon:hover {
    transform: scale(1.03);
}

.foto {
    width: 170px;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
    border: 3px solid #116530;
}

/* SILUET */
.siluet {
    width: 170px;
    height: 190px;
    border-radius: 12px;
    background: #d1d5db;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: auto;
}

.siluet-icon {
    width: 90px;
    height: 125px;
    position: relative;
}

.siluet-icon::before {
    content: "";
    position: absolute;
    width: 55px;
    height: 55px;
    background: #6b7280;
    border-radius: 50%;
    top: 0;
    left: 18px;
}

.siluet-icon::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 75px;
    background: #6b7280;
    border-radius: 50px 50px 10px 10px;
    bottom: 0;
    left: 0;
}

.nomor {
    font-size: 42px;
    font-weight: bold;
    color: #116530;
    margin-top: 8px;
}

.nama {
    font-size: 20px;
    font-weight: bold;
    margin: 8px;
}

.pilih {
    background: #116530;
    color: white;
    border: 0;
    padding: 12px 28px;
    border-radius: 9px;
    font-size: 17px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 430px;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
}

.modal-box h2 {
    margin-top: 0;
}

.btn-container {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 25px;
}

.btn {
    border: 0;
    padding: 13px 22px;
    border-radius: 9px;
    font-size: 16px;
}

.ulangi {
    background: #ddd;
}

.ya {
    background: #116530;
    color: white;
}

.berhasil {
    color: #116530;
    font-size: 22px;
    font-weight: bold;
}

/* MODE PORTRAIT */
@media (orientation: portrait) {

    .portrait-warning {
        display: flex;
    }

    .calon-container {
        flex-direction: column;
        align-items: center;
    }

    .calon {
        width: 90%;
    }
}

@media (orientation: landscape) {
    .portrait-warning {
        display: none;
    }
}

.portrait-warning {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: #111827;
    color: white;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.warning-box {
    max-width: 500px;
}

.warning-box h2 {
    font-size: 28px;
}
</style>
</head>

<body>

<!-- PERINGATAN HP HARUS LANDSCAPE -->
<div class="portrait-warning">
    <div class="warning-box">
        <h2>PUTAR HP ANDA</h2>
        <p>
            Sistem pemilihan menggunakan posisi
            <b>LANDSCAPE</b>.
        </p>
        <p>Silakan putar HP ke posisi mendatar.</p>
    </div>
</div>

<header class="header">
    <h1>PILKADES BANTARSARI</h1>
    <p>Pemilihan Kepala Desa</p>
</header>

<div class="container">

    </div>

    <div class="calon-container">

        <!-- CALON 1 -->
        <div class="calon" onclick="pilihCalon(1, 'CALON NOMOR 1')">

            <div class="siluet">

            <div class="nama">
                CALON NOMOR 1
            </div>

            <button class="pilih">
                PILIH
            </button>

        </div>


        <!-- CALON 2 -->
        <div class="calon" onclick="pilihCalon(2, 'CALON NOMOR 2')">

            <div class="siluet">
                <div class="siluet-icon"></div>
            </div>

            <div class="nomor">2</div>

            <div class="nama">
                CALON NOMOR 2
            </div>

            <button class="pilih">
                PILIH
            </button>

        </div>


        <!-- CALON 3 -->
