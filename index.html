<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilkades Bantarsari — Prototype V2</title>

<style>
:root{
--green:#126b45;
--green2:#168455;
--bg:#f4f7f6;
--text:#183028;
--muted:#6b7b75;
--line:#dce5e1;
--white:#fff;
--danger:#b42318
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
font-family:Arial,Helvetica,sans-serif;
color:var(--text)
}

header{
background:var(--green);
color:white;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:5
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:44px;
height:44px;
border-radius:50%;
background:white;
color:var(--green);
display:grid;
place-items:center;
font-weight:800
}

.brand h1{
font-size:18px;
margin:0
}

.brand p{
font-size:12px;
margin:3px 0 0;
opacity:.85
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:700;
font-size:15px;
cursor:pointer
}

.btn{
background:var(--green2);
color:white
}

.btn.light{
background:white;
color:var(--green);
border:1px solid #bcd3c8
}

.btn.gray{
background:#edf1ef;
color:#33443d
}

.btn.danger{
background:#fff0ef;
color:var(--danger)
}

main{
max-width:900px;
margin:0 auto;
padding:22px 14px 60px
}

.hero{
text-align:center;
padding:20px 0
}

.hero h2{
font-size:28px;
margin:10px 0 6px
}

.hero p{
color:var(--muted);
margin:0
}

.card{
background:white;
border:1px solid var(--line);
border-radius:16px;
padding:18px;
margin:14px 0;
box-shadow:0 3px 12px #173c2b0c
}

.card h3{
margin:0 0 12px
}

.center{
text-align:center
}

.muted{
color:var(--muted)
}

.small{
font-size:12px
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap
}

input{
width:100%;
padding:13px;
border:1px solid #cbd8d2;
border-radius:10px;
font-size:16px;
margin:7px 0 12px
}

.reader{
width:100%;
max-width:480px;
margin:auto
}

.status{
padding:12px;
border-radius:10px;
background:#edf8f2;
color:#175c3e;
margin:10px 0
}

.warning{
background:#fff8e8;
color:#7a4a00
}

.dangerText{
color:var(--danger)
}

.grid{
display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(210px,1fr)
);
gap:12px
}

.candidate{
border:2px solid var(--line);
border-radius:15px;
padding:14px;
text-align:center;
cursor:pointer;
background:white
}

.candidate.selected{
border-color:var(--green2);
box-shadow:0 0 0 3px #16845522
}

.photo{
height:150px;
border-radius:12px;
background:#e9efec;
display:grid;
place-items:center;
font-size:38px;
color:#809089;
font-weight:800;
margin-bottom:10px
}

.candidate .num{
display:inline-grid;
place-items:center;
width:36px;
height:36px;
border-radius:50%;
background:var(--green);
color:#fff;
font-weight:800
}

.topline{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.stat{
background:white;
border:1px solid var(--line);
border-radius:14px;
padding:15px;
text-align:center
}

.stat b{
display:block;
font-size:25px;
color:var(--green);
margin-bottom:5px
}

.bar{
height:10px;
background:#e9efec;
border-radius:99px;
overflow:hidden
}

.fill{
height:100%;
background:var(--green2)
}

.ticket{
border:1px dashed #65756f;
background:#fff;
padding:18px;
max-width:420px;
margin:auto;
font-family:monospace
}

.ticket hr{
border:0;
border-top:1px dashed #777
}

.token{
font-size:20px;
font-weight:800;
letter-spacing:3px
}

.hidden{
display:none!important
}

footer{
text-align:center;
color:var(--muted);
font-size:11px;
padding:20px
}

@media(max-width:520px){
.stats{
grid-template-columns:1fr
}

.hero h2{
font-size:24px
}
}
</style>
</head>

<body>

<header>

<div class="brand">

<div class="logo">
PB
</div>

<div>
<h1>Pilkades Bantarsari</h1>
<p>Prototype / Simulasi V2</p>
</div>

</div>

<button
class="btn light"
onclick="admin()">
Dashboard Panitia
</button>

</header>


<main id="app"></main>


<footer>
PROTOTYPE SIMULASI — bukan sistem pemungutan suara resmi.
</footer>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<script>

const KEY='pilkades_bantarsari_v2';


const candidates=[

{
id:1,
no:1,
name:'Calon 1'
},

{
id:2,
no:2,
name:'Calon 2'
},

{
id:3,
no:3,
name:'Agus Sopian, S.T.'
}

];


const initial={

voters:[

...Array.from(
{length:5},
(_,i)=>({
id:'D1-'+(i+1),
tps:1,
used:false
})
),

...Array.from(
{length:5},
(_,i)=>({
id:'D2-'+(i+1),
tps:2,
used:false
})
),

...Array.from(
{length:5},
(_,i)=>({
id:'D3-'+(i+1),
tps:3,
used:false
})
)

],

votes:[]

};


function load(){

return JSON.parse(
localStorage.getItem(KEY)
||
JSON.stringify(initial)
);

}


function save(d){

localStorage.setItem(
KEY,
JSON.stringify(d)
);

}


function home(){

document.getElementById('app').innerHTML=`

<section class="hero">

<h2>
PEMILIHAN KEPALA DESA
</h2>

<p>
Desa Bantarsari — simulasi alur QR Code
</p>

</section>


<div class="card center">

<h3>
1. Pindai QR Code Surat Undangan
</h3>

<p class="muted">
Arahkan kamera tablet/HP ke QR Code pada surat undangan.
</p>


<div id="reader" class="reader">
</div>


<button
class="btn"
onclick="startScan()">

📷 Mulai Pindai QR

</button>


<button
class="btn gray"
onclick="manual()">

Masukkan kode demo

</button>


<div id="scanStatus">
</div>

</div>


<div class="card center">

<h3>
Demo QR
</h3>

<p class="small muted">

Untuk uji coba gunakan:

D1-1 sampai D3-5.

</p>


<button
class="btn light"
onclick="showQR('D1-1')">

Tampilkan QR D1-1

</button>


<div
id="qrDemo"
class="hidden">
</div>

</div>

`;

}


let scanner=null;


async function startScan(){

const status=
document.getElementById('scanStatus');


status.innerHTML=
'<div class="status">Meminta izin kamera…</div>';


try{

if(scanner){

try{

await scanner.stop();

}catch(e){}

}


scanner=
new Html5Qrcode("reader");


await scanner.start(

{facingMode:"environment"},

{
fps:10,
qrbox:{
width:240,
height:240
}
},

async text=>{

await scanner.stop();

scanner=null;

verify(
text.trim().toUpperCase()
);

},

()=>{}

);


status.innerHTML=
'<div class="status">Kamera aktif. Arahkan ke QR Code.</div>';


}catch(e){

status.innerHTML=
'<div class="status warning">Kamera tidak dapat digunakan. Pastikan izin kamera diberikan dan website dibuka melalui HTTPS.</div>';

}

}


function manual(){

const code=
prompt(
'Masukkan kode QR demo, misalnya D1-1'
);

if(code){

verify(
code.trim().toUpperCase()
);

}

}


function verify(code){

const d=load();

const v=
d.voters.find(
x=>x.id===code
);


if(!v){

alert(
'QR tidak dikenal pada data demo.'
);

return;

}


if(v.used){

alert(
'Pemilih ini sudah menggunakan hak pilih pada simulasi.'
);

return;

}


window.voterId=v.id;


document.getElementById('app').innerHTML=`

<div class="card center">

<h2>
✓ QR Berhasil Dibaca
</h2>

<p class="muted">
Data pemilih terverifikasi untuk simulasi.
</p>


<div class="ticket">

<b>
DESA BANTARSARI
</b>

<hr>

Nomor DPT :
<b>${v.id}</b>

<br>

TPS :
<b>${v.tps}</b>

<br>

Status :
<b>BELUM MEMILIH</b>

</div>

<br>


<button
class="btn"
onclick="choose()">

Lanjut ke Pemilihan

</button>

</div>

`;

}


function choose(){

const d=load();

const v=
d.voters.find(
v=>v.id===window.voterId
);


document.getElementById('app').innerHTML=`

<div class="topline">

<h2>
2. Pilih Calon
</h2>

<span>
TPS ${v.tps}
</span>

</div>


<div class="card">

<p class="muted">
Klik foto/nama calon yang dipilih.
</p>


<div class="grid">

${candidates.map(c=>`

<div
class="candidate"
id="c${c.id}"
onclick="selectCandidate(${c.id})"
>

<div class="photo">

NO. ${c.no}

</div>

<div class="num">

${c.no}

</div>

<h3>
${c.name}
</h3>

<span class="muted">
Calon Kepala Desa
</span>

</div>

`).join('')}

</div>


<div
id="chosen"
class="status hidden">
</div>


<br>


<button
class="btn"
onclick="confirmChoice()">

Pilih kandidat ini

</button>

</div>

`;

window.choice=null;

}


function selectCandidate(id){

window.choice=id;


document
.querySelectorAll('.candidate')
.forEach(
x=>x.classList.remove('selected')
);


document
.getElementById('c'+id)
.classList.add('selected');


const c=
candidates.find(
x=>x.id===id
);


const el=
document.getElementById('chosen');


el.classList.remove('hidden');


el.innerHTML=
'Pilihan sementara: <b>No. '+
c.no+
' — '+
c.name+
'</b>';

}


function confirmChoice(){

if(!window.choice){

alert(
'Silakan pilih kandidat.'
);

return;

}


const c=
candidates.find(
x=>x.id===window.choice
);


document.getElementById('app').innerHTML=`

<div class="card center">

<h2>
3. Konfirmasi Pilihan
</h2>


<div class="ticket">

<b>
CALON YANG DIPILIH
</b>

<hr>

<div class="token">
NO. ${c.no}
</div>

<br>

<b>
${c.name}
</b>

</div>


<p class="muted">

Jika benar tekan PILIH.
Jika salah tekan ULANGI.

</p>


<button
class="btn gray"
onclick="choose()">

ULANGI

</button>


<button
class="btn"
onclick="saveVote()">

PILIH

</button>

</div>

`;

}


function saveVote(){

const d=load();


const v=
d.voters.find(
x=>x.id===window.voterId
);


if(!v || v.used){

alert(
'Pemilih sudah digunakan.'
);

return;

}


const token=
Math.random()
.toString(36)
.slice(2,10)
.toUpperCase();


const bilik=
String(
Math.floor(
Math.random()*20
)+1
)
.padStart(2,'0');


d.votes.push({

voterId:v.id,

tps:v.tps,

candidateId:window.choice,

token:token,

time:new Date().toISOString()

});


v.used=true;


save(d);


document.getElementById('app').innerHTML=`

<div class="card center">

<h2>
✓ SUARA TERSIMPAN
</h2>

<p>
Proses pemilihan simulasi berhasil.
</p>


<div
class="ticket"
id="printArea"
>

<b>
PILKADES BANTARSARI
</b>

<hr>

BUKTI MEMILIH

<br><br>

TPS :
<b>${v.tps}</b>

<br>

NOMOR BILIK :
<b>${bilik}</b>

<br>

TOKEN :

<span class="token">
${token}
</span>

<hr>

<small>
Bukti ini tidak menampilkan pilihan kandidat.
</small>

</div>


<br>


<button
class="btn"
onclick="window.print()">

🖨 Cetak Bukti

</button>


<button
class="btn gray"
onclick="home()">

Selesai

</button>

</div>

`;

}


function admin(){

const d=load();


const total=
d.voters.length;


const used=
d.voters.filter(
v=>v.used
).length;


document.getElementById('app').innerHTML=`

<div class="topline">

<h2>
Dashboard Panitia
</h2>


<button
class="btn gray"
onclick="home()">

Halaman Pemilih

</button>

</div>


<div class="stats">


<div class="stat">

<b>
${total}
</b>

DPT Demo

</div>


<div class="stat">

<b>
${used}
</b>

Sudah Memilih

</div>


<div class="stat">

<b>
${total-used}
</b>

Belum Memilih

</div>


</div>


<div class="card">

<h3>
Rekap Suara
</h3>


${candidates.map(c=>{

let n=
d.votes.filter(
v=>v.candidateId===c.id
).length;


let p=
used
?
Math.round(n/used*100)
:
0;


return `

<p>

<b>
No. ${c.no} — ${c.name}
</b>

· ${n} suara (${p}%)

</p>


<div class="bar">

<div
class="fill"
style="width:${p}%">
</div>

</div>

`;

}).join('')}

</div>


<div class="card">

<h3>
Rekap TPS
</h3>


${[1,2,3].map(t=>{

let all=
d.voters.filter(
v=>v.tps===t
).length;


let u=
d.voters.filter(
v=>v.tps===t && v.used
).length;


return `

<p>

<b>
TPS ${t}
</b>:

${u}/${all}

pemilih demo sudah memilih.

</p>

`;

}).join('')}

</div>


<div class="card">

<h3>
Data Uji QR
</h3>

<p class="small muted">

D1-1 s.d. D1-5 = TPS 1

<br>

D2-1 s.d. D2-5 = TPS 2

<br>

D3-1 s.d. D3-5 = TPS 3

</p>

</div>


<div class="card">

<button
class="btn danger"
onclick="resetDemo()">

Reset data simulasi

</button>

<p class="small dangerText">

Hanya menghapus data demo pada browser ini.

</p>

</div>

`;

}


function resetDemo(){

if(
confirm(
'Reset semua data simulasi?'
)
){

localStorage.removeItem(KEY);

admin();

}

}


function showQR(code){

const box=
document.getElementById('qrDemo');


box.classList.remove('hidden');


box.innerHTML='';


const img=
document.createElement('img');


img.alt='QR '+code;


img.style.maxWidth='260px';


img.src=
'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+
encodeURIComponent(code);


box.appendChild(img);


box.insertAdjacentHTML(
'beforeend',
'<p><b>QR: '+code+'</b></p>'
);

}


home();

</script>

</body>
</html>
